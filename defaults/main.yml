---
# fail2ban sshd config
fail2ban_sshd_bantime: 1800
fail2ban_sshd_findtime: 7200
fail2ban_sshd_maxretry: 5
fail2ban_sshd_bantime_increment: 'true'
fail2ban_sshd_whitelist: []
fail2ban_iptables_sshd_action: iptables-allports[name=sshd, protocol=all]
fail2ban_firewalld_sshd_action: firewallcmd-allports[name=sshd, protocol=all]
