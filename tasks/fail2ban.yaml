- name: Install EPEL on AL2
  ansible.builtin.yum:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - "amazon-linux-extras"
    - "epel-release"
  when:
   - ansible_distribution == "Amazon"
   - ansible_distribution_major_version | int == 2

- name: Install fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present
  become: true
  tags: ['fail2ban']

- name: Configure fail2ban sshd jail
  ansible.builtin.template:
    src: "etc.fail2ban.jail.d.sshd.conf.j2"
    dest: "/etc/fail2ban/jail.d/sshd.conf"
    owner: root
    group: root
    mode: 0640
  become: true
  notify: restart fail2ban
  tags: ['fail2ban']

- name: Ensure fail2ban service is started and enabled on boot
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  become: true
  tags: ['fail2ban']
